[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "iris-ml-pipeline"
version = "0.1.0"
description = "Proyecto completo de ML pipeline para clasificación de Iris con FastAPI, pruebas y CI/CD"
authors = ["Miguel Angel Mejia"]
readme = "README.md"
license = "MIT"
packages = [{include = "iris_ml", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
scikit-learn = "^1.3.2"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.2"
pydantic-settings = "^2.1.0"
pandas = "^2.1.3"
numpy = "^1.26.2"
dynaconf = "^3.2.4"
python-dotenv = "^1.0.0"
httpx = ">=0.23.0,<0.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.1"
pytest-mock = "^3.12.0"
black = "^23.12.0"
pycodestyle = "^2.11.1"
pydocstyle = "^6.3.0"

[tool.poetry.scripts]
iris-train = "iris_ml.train:main"
iris-predict = "iris_ml.predict:main"
iris-api = "iris_ml.api.main:run_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/iris_ml --cov-report=html"

[tool.pycodestyle]
max-line-length = 100
